name: Compile LaTeX and generate ICS

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-english \
            python3 \
            python3-pip

      - name: Run ICS generator
        run: |
          if [ -f scripts/generate_combined_ics.py ]; then
            python3 scripts/generate_combined_ics.py || true
          else
            echo "ICS generator not found; skipping"
          fi

      - name: Compile planner_full.tex
        run: |
          if [ -f planner_full.tex ]; then
            pdflatex -interaction=nonstopmode planner_full.tex || true
            pdflatex -interaction=nonstopmode planner_full.tex || true
          else
            echo "planner_full.tex not found; skipping LaTeX compile"
          fi

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Add generated planner_full.pdf and planner_combined.ics"
          file_pattern: |
            planner_full.pdf
            planner_combined.ics
